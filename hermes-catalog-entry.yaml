name: werracle-evm-guard
repo: https://github.com/pCwOrM/hermes-werracle-guard
sha: 7bfe4caaf81e817153aabc0f59592d1f8c0f1544
version: "1.0.1"
description: >-
  Autonomous EVM execution guardrail and DeFi liquidation risk radar for Hermes Agent.
  Intercepts cast send transactions before broadcast to block unlimited token approvals,
  NFT operator takeovers, and high-value transfers. Performs Radar lookups to
  api.werracle.com by default on every werracle tool call and intercepted cast send.
author: Volkan Dagli
license: MIT
homepage: https://github.com/pCwOrM/hermes-werracle-guard
categories:
  - security
  - web3
  - defi
tags:
  - ethereum
  - base
  - defi
  - mev
  - guardrail
  - morpho
  - aave
  - chainlink
  - security
capabilities:
  provides_tools:
    - werracle_simulate_tx
    - werracle_mempool_radar
    - werracle_liquidation_health
    - werracle_inspect_contract
  provides_hooks:
    - pre_tool_call
    - post_tool_call
  provides_cli: true
  provides_middleware: []
  requires_env:
    - WERRACLE_API_KEY
