[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-werracle-guard"
version = "1.0.1"
description = "Autonomous EVM execution guardrail and DeFi liquidation risk radar for Hermes Agent."
readme = "README.md"
authors = [{ name = "Volkan Dagli", email = "ask@answerr.me" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0,<10.0",
    "pyyaml>=6.0,<7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", "__pycache__"]
addopts = "--ignore=__init__.py"

[project.urls]
"Homepage" = "https://radar.werracle.com"
"Repository" = "https://github.com/pCwOrM/hermes-werracle-guard"
"Bug Tracker" = "https://github.com/pCwOrM/hermes-werracle-guard/issues"
